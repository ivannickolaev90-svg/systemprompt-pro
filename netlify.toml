# Сайт переехал на Cloudflare Pages. Если Netlify снова соберёт этот репозиторий,
# старый адрес будет навсегда (301) перенаправлять посетителей и поисковики на новый.
[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/*"
  to = "https://systemprompt-pro.pages.dev/:splat"
  status = 301
  force = true
