# Сайт переехал на Cloudflare Pages. Если Netlify снова соберёт этот репозиторий,
# старый адрес будет навсегда (301) перенаправлять посетителей и поисковики на новый.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

# Посредник к Groq для российского сервера — не перенаправлять
[[redirects]]
  from = "/groq/*"
  to = "/groq/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "https://systemprompt-pro.com/:splat"
  status = 301
  force = true
